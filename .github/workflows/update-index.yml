name: Update patch index

on:
  push:
    branches: [main]
    paths:
      - 'prospero_patches/**'
      - 'scripts/update_index.py'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Build title ID and version index
        run: python3 scripts/update_index.py
      - name: Publish changed index
        run: |
          if git diff --quiet -- patches.json && git ls-files --error-unmatch patches.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- patches.json
          git commit -m '[Patches] Update download index'
          git push origin HEAD:main
